name: gfcodes-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    logging: *default-logging

  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
    logging: *default-logging

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      API_PUBLIC_URL: https://${API_DOMAIN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENSELORA_GEMINI_API_KEY: ${ENSELORA_GEMINI_API_KEY}
      ENSELORA_GEMINI_MODEL: ${ENSELORA_GEMINI_MODEL:-gemini-3.7-flash}
      ENSELORA_REPLICATE_API_TOKEN: ${ENSELORA_REPLICATE_API_TOKEN}
      ENSELORA_REPLICATE_BACKGROUND_MODEL: ${ENSELORA_REPLICATE_BACKGROUND_MODEL}
      ENSELORA_ALLOWED_REMOTE_IMAGE_HOSTS: ${ENSELORA_ALLOWED_REMOTE_IMAGE_HOSTS:-replicate.delivery}
      ENSELORA_REPLICATE_TRYON_MODEL_PRIMARY: ${ENSELORA_REPLICATE_TRYON_MODEL_PRIMARY:-prunaai/p-image-try-on}
      ENSELORA_REPLICATE_TRYON_MODEL_SECONDARY: ${ENSELORA_REPLICATE_TRYON_MODEL_SECONDARY:-}
      ENSELORA_TRYON_COMPARE_ENABLED: ${ENSELORA_TRYON_COMPARE_ENABLED:-false}
      ENSELORA_REVENUECAT_SECRET_API_KEY: ${ENSELORA_REVENUECAT_SECRET_API_KEY}
      ENSELORA_REVENUECAT_WEBHOOK_AUTHORIZATION: ${ENSELORA_REVENUECAT_WEBHOOK_AUTHORIZATION}
      ENSELORA_REVENUECAT_WEBHOOK_SIGNING_SECRET: ${ENSELORA_REVENUECAT_WEBHOOK_SIGNING_SECRET}
      ENSELORA_TRYON_CREDIT_PRODUCTS_JSON: ${ENSELORA_TRYON_CREDIT_PRODUCTS_JSON}
      ENSELORA_SUPABASE_URL: ${ENSELORA_SUPABASE_URL}
      ENSELORA_SUPABASE_PUBLISHABLE_KEY: ${ENSELORA_SUPABASE_PUBLISHABLE_KEY}
      ENSELORA_SUPABASE_SECRET_KEY: ${ENSELORA_SUPABASE_SECRET_KEY}
      ENSELORA_APP_ATTEST_MODE: ${ENSELORA_APP_ATTEST_MODE:-off}
      ENSELORA_APP_ATTEST_APP_ID: ${ENSELORA_APP_ATTEST_APP_ID:-P657J6X62B.com.gabriel.enselora}
      ENSELORA_APP_ATTEST_ENVIRONMENT: ${ENSELORA_APP_ATTEST_ENVIRONMENT:-production}
      ENSELORA_ADMIN_API_KEY: ${ENSELORA_ADMIN_API_KEY}
      ENSELORA_ADMIN_ALLOWED_IPS: ${ENSELORA_ADMIN_ALLOWED_IPS:-}
      ENSELORA_ADMIN_RATE_LIMIT_PER_MINUTE: ${ENSELORA_ADMIN_RATE_LIMIT_PER_MINUTE:-20}
      ENSELORA_AUTH_RATE_LIMIT_PER_MINUTE: ${ENSELORA_AUTH_RATE_LIMIT_PER_MINUTE:-120}
      ENSELORA_GLOBAL_AI_RATE_LIMIT_PER_MINUTE: ${ENSELORA_GLOBAL_AI_RATE_LIMIT_PER_MINUTE:-60}
      ENSELORA_IP_AI_RATE_LIMIT_PER_MINUTE: ${ENSELORA_IP_AI_RATE_LIMIT_PER_MINUTE:-15}
      ENSELORA_GEMINI_MAX_CONCURRENCY: ${ENSELORA_GEMINI_MAX_CONCURRENCY:-8}
      ENSELORA_REPLICATE_MAX_CONCURRENCY: ${ENSELORA_REPLICATE_MAX_CONCURRENCY:-3}
      ENSELORA_GEMINI_INPUT_MICROS_PER_MILLION: ${ENSELORA_GEMINI_INPUT_MICROS_PER_MILLION:-750000}
      ENSELORA_GEMINI_OUTPUT_MICROS_PER_MILLION: ${ENSELORA_GEMINI_OUTPUT_MICROS_PER_MILLION:-3750000}
      ENSELORA_GEMINI_REQUEST_RESERVE_COST_MICROS: ${ENSELORA_GEMINI_REQUEST_RESERVE_COST_MICROS:-25000}
      ENSELORA_REPLICATE_BACKGROUND_COST_MICROS: ${ENSELORA_REPLICATE_BACKGROUND_COST_MICROS:-100000}
      ENSELORA_REPLICATE_TRYON_COST_MICROS: ${ENSELORA_REPLICATE_TRYON_COST_MICROS:-250000}
      ENSELORA_DAILY_COST_HARD_LIMIT_MICROS: ${ENSELORA_DAILY_COST_HARD_LIMIT_MICROS:-10000000}
      ENSELORA_DAILY_COST_ALERT_MICROS: ${ENSELORA_DAILY_COST_ALERT_MICROS:-8000000}
      ENSELORA_COST_ALERT_WEBHOOK_URL: ${ENSELORA_COST_ALERT_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4321/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - backend
    logging: *default-logging

  redis:
    image: redis:8.8.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  redis_data:
